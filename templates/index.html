<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast - Weather Update Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00c6fb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      height: 85vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1e88e5;
      color: #ffffff;
      padding: 16px 20px;
    }

    .chat-header h1 { font-size: 20px; }
    .chat-header p { font-size: 13px; opacity: 0.9; margin-top: 2px; }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f2f7fc;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #1e88e5;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffffff;
      color: #222222;
      border: 1px solid #dde6f0;
      border-bottom-left-radius: 4px;
    }

    .message.error { color: #c62828; }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e3e9f0;
      background: #ffffff;
    }

    .input-area input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccd6e0;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
    }

    .input-area input:focus { border-color: #1e88e5; }

    .input-area button {
      padding: 0 20px;
      border: none;
      border-radius: 24px;
      background: #1e88e5;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    .input-area button:disabled { background: #90b8e0; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🌤️ SkyCast</h1>
      <p>Your weather update assistant</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">Hi! I'm SkyCast 🌦️ Ask me about the weather in any city.</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="e.g. Weather in Chennai today" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      sendBtn.disabled = true;
      const loading = addMessage("Checking the skies...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();

        if (data.reply) {
          loading.textContent = data.reply;
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        } else {
          loading.textContent = data.error || "Something went wrong.";
          loading.classList.add("error");
        }
      } catch (error) {
        loading.textContent = "Unable to reach the server.";
        loading.classList.add("error");
      }

      sendBtn.disabled = false;
      userInput.focus();
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
